<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный Альбом на GitHub</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #bb86fc;
            --error-color: #cf6679;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #login-screen, #settings-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background-color: var(--bg-color);
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 100;
        }
        #settings-screen {
            z-index: 200; background-color: rgba(18, 18, 18, 0.95);
        }
        .hidden { display: none !important; }

        .box {
            background: var(--card-bg); padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 300px;
            position: relative;
        }
        .settings-box { width: 450px; max-width: 90vw; padding: 30px; text-align: left; }
        .settings-box h2, .settings-box p { text-align: center; }

        input[type="password"], input[type="text"], button {
            width: 100%; padding: 12px; margin: 10px 0; border: none;
            border-radius: 6px; box-sizing: border-box; font-size: 16px;
        }
        input[type="password"], input[type="text"] { background: #2c2c2c; color: white; outline: none; }
        input[type="password"]:focus, input[type="text"]:focus { border: 1px solid var(--accent-color); }
        
        button {
            background-color: var(--accent-color); color: #000; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { background-color: #a06cd5; }
        button.secondary { background-color: #333; color: white; }
        button.secondary:hover { background-color: #444; }

        #login-error { color: var(--error-color); font-size: 14px; margin-top: 10px; display: none; }

        .settings-btn {
            position: absolute; top: 20px; right: 20px; width: auto;
            background-color: #e63946; color: white; padding: 10px 18px; font-size: 14px;
            font-weight: bold; border-radius: 8px; border: none;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4); cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .settings-btn:hover { background-color: #ff4d5a; transform: translateY(-2px); }

        .settings-label { text-align: left; font-size: 12px; color: #aaa; margin-bottom: -5px; margin-top: 15px; display: block; }

        #album-screen { display: none; width: 100%; max-width: 1200px; }
        #album-screen.active { display: block; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #444; padding: 30px; text-align: center;
            border-radius: 10px; cursor: pointer; transition: 0.3s;
            margin-bottom: 30px; position: relative;
        }
        .upload-area:hover { border-color: var(--accent-color); background: rgba(187, 134, 252, 0.05); }
        .upload-area input { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .gallery-item {
            background: var(--card-bg); border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s; position: relative;
        }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; display: block; }

        .delete-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
            color: var(--error-color); border: none; border-radius: 15px; width: auto;
            padding: 5px 10px; cursor: pointer; font-size: 14px; opacity: 0; transition: 0.3s;
        }
        .gallery-item:hover .delete-btn { opacity: 1; }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--accent-color);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin: 20px auto; display: none;
        }
        .status-msg { text-align: center; color: #aaa; margin-bottom: 20px; font-style: italic; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 600px) { .header button { width: auto; padding: 10px 15px; } }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen">
        <button class="settings-btn" onclick="openSettings()" title="Настройки GitHub">⚙️ Настройки</button>
        <div class="box">
            <h2>Вход в альбом</h2>
            <input type="password" id="password-input" placeholder="Введите пароль">
            <button onclick="checkPassword()">Войти</button>
            <div id="login-error">Неверный пароль</div>
        </div>
    </div>

    <!-- МЕНЮ НАСТРОЕК -->
    <div id="settings-screen" class="hidden">
        <div class="box settings-box">
            <h2>Настройки GitHub</h2>
            <p style="font-size: 13px; color: #aaa;">Нужен токен с правами <b>repo</b></p>
            
            <label class="settings-label">GitHub Token (Personal Access Token)</label>
            <input type="text" id="set-token" placeholder="ghp_xxxxxxxxxxxxxxxx">

            <label class="settings-label">Владелец репозитория (Owner)</label>
            <input type="text" id="set-owner" placeholder="serj-0101">

            <label class="settings-label">Название репозитория (Repo)</label>
            <input type="text" id="set-repo" placeholder="foto-3">

            <label class="settings-label">Ветка (Branch)</label>
            <input type="text" id="set-branch" placeholder="main">

            <label class="settings-label">Пароль для входа (локальный)</label>
            <input type="text" id="set-password" placeholder="Придумайте пароль">

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveSettings()">Сохранить</button>
                <button class="secondary" onclick="closeSettings()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН АЛЬБОМА -->
    <div id="album-screen">
        <div class="header">
            <h1>Фотохранилище GitHub ☁️</h1>
            <button class="secondary" onclick="logout()" style="width: auto;">Выйти</button>
        </div>

        <div class="status-msg" id="status-msg">Синхронизация с репозиторием...</div>

        <div class="upload-area" id="upload-area">
            <h3>Нажмите или перетащите фотографии сюда</h3>
            <p>Они сохранятся прямо в ваш GitHub репозиторий</p>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">
            <div class="loader" id="upload-loader"></div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // Настройки по умолчанию
        const DEFAULT_CONFIG = {
            token: '',
            owner: 'serj-0101',
            repo: 'foto-3',
            branch: 'main',
            password: '1234'
        };

        let config = { ...DEFAULT_CONFIG };
        let cloudPhotos = []; // Формат: [{url: "...", sha: "...", path: "..."}]

        function loadConfig() {
            config.token = localStorage.getItem('gh_token') || DEFAULT_CONFIG.token;
            config.owner = localStorage.getItem('gh_owner') || DEFAULT_CONFIG.owner;
            config.repo = localStorage.getItem('gh_repo') || DEFAULT_CONFIG.repo;
            config.branch = localStorage.getItem('gh_branch') || DEFAULT_CONFIG.branch;
            config.password = localStorage.getItem('gh_password') || DEFAULT_CONFIG.password;
        }
        
        loadConfig();

        // Базовый URL для обращения к API GitHub
        function getApiUrl(path = '') {
            return `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`;
        }

        // --- ЛОГИКА НАСТРОЕК ---
        function openSettings() {
            document.getElementById('set-token').value = config.token;
            document.getElementById('set-owner').value = config.owner;
            document.getElementById('set-repo').value = config.repo;
            document.getElementById('set-branch').value = config.branch;
            document.getElementById('set-password').value = config.password;
            document.getElementById('settings-screen').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
        }

        function saveSettings() {
            config.token = document.getElementById('set-token').value.trim();
            config.owner = document.getElementById('set-owner').value.trim();
            config.repo = document.getElementById('set-repo').value.trim();
            config.branch = document.getElementById('set-branch').value.trim();
            config.password = document.getElementById('set-password').value.trim();

            if (!config.token || !config.owner || !config.repo || !config.branch || !config.password) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            localStorage.setItem('gh_token', config.token);
            localStorage.setItem('gh_owner', config.owner);
            localStorage.setItem('gh_repo', config.repo);
            localStorage.setItem('gh_branch', config.branch);
            localStorage.setItem('gh_password', config.password);

            closeSettings();
            alert('Настройки успешно сохранены!');
        }

        // --- АВТОРИЗАЦИЯ ---
        function checkPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === config.password) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('album-screen').classList.add('active');
                loadGalleryFromCloud();
            } else {
                const err = document.getElementById('login-error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('album-screen').classList.remove('active');
            document.getElementById('password-input').value = '';
            cloudPhotos = [];
        }

        // --- РАБОТА С GITHUB API ---
        
        // Чтение data.json (без авторизации, через raw.githubusercontent для скорости)
        async function fetchCloudData() {
            const rawUrl = `https://raw.githubusercontent.com/${config.owner}/${config.repo}/${config.branch}/data.json`;
            const res = await fetch(rawUrl + '?t=' + new Date().getTime());
            if (!res.ok) throw new Error('Файл данных еще не создан');
            const data = await res.json();
            return data.photos || [];
        }

        // Обновление data.json в репозитории (с авторизацией)
        async function updateDataJson(photosArray) {
            const apiUrl = getApiUrl('data.json');
            const headers = {
                'Authorization': `token ${config.token}`,
                'Accept': 'application/vnd.github.v3+json'
            };

            let sha = null;
            
            // Получаем текущий SHA файла, чтобы его перезаписать
            try {
                const metaRes = await fetch(apiUrl, { headers });
                if (metaRes.ok) {
                    const metaData = await metaRes.json();
                    sha = metaData.sha;
                }
            } catch (e) {}

            const content = btoa(unescape(encodeURIComponent(JSON.stringify({ photos: photosArray }))));

            const body = {
                message: `Update gallery (${new Date().toLocaleString()})`,
                content: content,
                branch: config.branch
            };
            if (sha) body.sha = sha; // Если файл есть, передаем SHA

            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.message || 'Ошибка сохранения data.json');
            }
        }

        // Загрузка картинки в папку images/
        async function uploadImageToGitHub(file) {
            const base64 = await getBase64(file);
            const cleanBase64 = base64.split(',')[1]; // Убираем префикс data:image/...
            
            const fileName = Date.now() + '_' + file.name.replace(/\s+/g, '_');
            const path = `images/${fileName}`;
            const apiUrl = getApiUrl(path);

            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `Upload ${fileName}`,
                    content: cleanBase64,
                    branch: config.branch
                })
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.message || 'Ошибка загрузки картинки');
            }

            const data = await res.json();
            const displayUrl = `https://${config.owner}.github.io/${config.repo}/${path}`;
            
            return { url: displayUrl, sha: data.content.sha, path: path };
        }

        // Удаление картинки из репозитория
        async function deleteImageFromGitHub(path, sha) {
            const apiUrl = getApiUrl(path);
            const res = await fetch(apiUrl, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `Delete ${path}`,
                    sha: sha,
                    branch: config.branch
                })
            });
            if (!res.ok) throw new Error('Ошибка удаления файла');
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // --- ЛОГИКА ГАЛЕРЕИ ---
        async function loadGalleryFromCloud() {
            const status = document.getElementById('status-msg');
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            status.innerText = 'Загрузка данных из репозитория...';
            status.style.display = 'block';
            status.style.color = '#aaa';

            try {
                cloudPhotos = await fetchCloudData();
                status.style.display = 'none';
                renderGallery();
            } catch (e) {
                if (e.message.includes('Файл данных еще не создан')) {
                    cloudPhotos = [];
                    status.style.display = 'none';
                    renderGallery();
                } else {
                    status.innerText = 'Ошибка! Проверьте настройки (Owner, Repo, Branch).';
                    status.style.color = '#cf6679';
                    console.error(e);
                }
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            if (cloudPhotos.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666;">Альбом пуст. Загрузите первую фотографию!</p>';
                return;
            }

            cloudPhotos.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.url}" alt="Фото" loading="lazy" onerror="this.parentElement.remove()">
                    <button class="delete-btn" onclick="deletePhoto(${index})">🗑 Удалить</button>
                `;
                gallery.appendChild(div);
            });
        }

        async function handleFiles(files) {
            const loader = document.getElementById('upload-loader');
            const uploadArea = document.getElementById('upload-area');
            const status = document.getElementById('status-msg');
            
            loader.style.display = 'block';
            uploadArea.style.pointerEvents = 'none';
            status.style.display = 'block';
            status.style.color = '#aaa';

            try {
                // 1. Получаем актуальный список фото
                cloudPhotos = await fetchCloudData().catch(() => []);

                for (let i = 0; i < files.length; i++) {
                    status.innerText = `Загрузка файла ${i + 1} из ${files.length} в GitHub...`;
                    const newFileData = await uploadImageToGitHub(files[i]);
                    cloudPhotos.push(newFileData);
                }

                status.innerText = 'Обновление базы данных...';
                await updateDataJson(cloudPhotos);
                status.style.display = 'none';
                renderGallery();

            } catch (e) {
                status.innerText = `ОШИБКА: ${e.message}`;
                status.style.color = '#cf6679';
                console.error(e);
                // Возвращаем старый список в случае ошибки
                loadGalleryFromCloud(); 
            }
            
            loader.style.display = 'none';
            uploadArea.style.pointerEvents = 'auto';
            document.getElementById('file-input').value = '';
        }

        async function deletePhoto(index) {
            if(!confirm('Удалить это фото из репозитория навсегда?')) return;
            
            const status = document.getElementById('status-msg');
            status.style.display = 'block';
            status.style.color = '#aaa';
            status.innerText = 'Удаление файла...';

            try {
                const photoToDelete = cloudPhotos[index];
                
                // Удаляем саму картинку
                await deleteImageFromGitHub(photoToDelete.path, photoToDelete.sha);
                
                // Удаляем из массива
                cloudPhotos.splice(index, 1);
                
                // Обновляем data.json
                await updateDataJson(cloudPhotos);
                
                status.style.display = 'none';
                renderGallery();
            } catch (e) {
                status.innerText = `Ошибка удаления: ${e.message}`;
                status.style.color = '#cf6679';
                console.error(e);
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
