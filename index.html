<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный Альбом на GitHub</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #bb86fc;
            --error-color: #cf6679;
            --success-color: #4caf50;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #login-screen, #settings-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
        }

        #settings-screen {
            z-index: 200;
            background-color: rgba(18, 18, 18, 0.98);
        }

        .hidden {
            display: none !important;
        }

        .box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
            position: relative;
        }

        .settings-box {
            width: 450px;
            max-width: 90vw;
            padding: 30px;
            text-align: left;
        }

        .settings-box h2,
        .settings-box p {
            text-align: center;
        }

        input[type="password"],
        input[type="text"],
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        input[type="password"],
        input[type="text"] {
            background: #2c2c2c;
            color: white;
            outline: none;
            transition: border 0.3s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            border: 2px solid var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        button:hover {
            background-color: #a06cd5;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: #333;
            color: white;
        }

        button.secondary:hover {
            background-color: #444;
        }

        #login-error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: auto;
            background-color: #e63946;
            color: white;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 300;
        }

        .settings-btn:hover {
            background-color: #ff4d5a;
            transform: translateY(-2px);
        }

        .settings-label {
            text-align: left;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            margin-top: 15px;
            display: block;
        }

        #album-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin: 0 auto;
        }

        #album-screen.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-top: 60px;
        }

        .header h1 {
            margin: 0;
            flex: 1;
        }

        .upload-area {
            border: 2px dashed #444;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            position: relative;
            background: #0a0a0a;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(187, 134, 252, 0.08);
        }

        .upload-area.drag-over {
            border-color: var(--accent-color);
            background: rgba(187, 134, 252, 0.15);
        }

        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-area h3,
        .upload-area p {
            margin: 0;
            pointer-events: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            position: relative;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            border-radius: 20px;
            width: auto;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: var(--error-color);
            color: white;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .status-msg {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-style: italic;
            min-height: 25px;
        }

        .status-msg.error {
            color: var(--error-color);
            font-style: normal;
        }

        .status-msg.success {
            color: var(--success-color);
            font-style: normal;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                margin-top: 80px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header button {
                width: 100%;
            }

            .box {
                width: 90vw;
                max-width: 350px;
                padding: 30px;
            }

            .settings-box {
                width: 90vw;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .upload-area {
                padding: 20px;
            }

            .settings-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen">
        <button class="settings-btn" onclick="openSettings()" title="Настройки GitHub">⚙️ Настройки</button>
        <div class="box">
            <h2>🔐 Вход в альбом</h2>
            <input type="password" id="password-input" placeholder="Введите пароль">
            <button onclick="checkPassword()">Войти</button>
            <div id="login-error">❌ Неверный пароль</div>
        </div>
    </div>

    <!-- МЕНЮ НАСТРОЕК -->
    <div id="settings-screen" class="hidden">
        <div class="box settings-box">
            <h2>⚙️ Настройки GitHub</h2>
            <p style="font-size: 13px; color: #aaa;">Нужен токен с правами <b>repo</b></p>

            <label class="settings-label">GitHub Token (Personal Access Token)</label>
            <input type="text" id="set-token" placeholder="ghp_xxxxxxxxxxxxxxxx">

            <label class="settings-label">Владелец репозитория (Owner)</label>
            <input type="text" id="set-owner" placeholder="serj-0101">

            <label class="settings-label">Название репозитория (Repo)</label>
            <input type="text" id="set-repo" placeholder="foto-3">

            <label class="settings-label">Ветка (Branch)</label>
            <input type="text" id="set-branch" placeholder="main">

            <label class="settings-label">Пароль для входа (локальный)</label>
            <input type="text" id="set-password" placeholder="Придумайте пароль">

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveSettings()">✓ Сохранить</button>
                <button class="secondary" onclick="closeSettings()">✕ Отмена</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН АЛЬБОМА -->
    <div id="album-screen">
        <div class="header">
            <h1>☁️ Фотохранилище GitHub</h1>
            <button class="secondary" onclick="logout()" style="width: auto;">↪️ Выйти</button>
        </div>

        <div class="status-msg" id="status-msg"></div>

        <div class="upload-area" id="upload-area">
            <h3>📸 Нажмите или перетащите фотографии сюда</h3>
            <p style="font-size: 14px; color: #999;">Они сохранятся прямо в ваш GitHub репозиторий</p>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">
            <div class="loader" id="upload-loader"></div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // Настройки по умолчанию
        const DEFAULT_CONFIG = {
            token: '',
            owner: 'serj-0101',
            repo: 'foto-3',
            branch: 'main',
            password: '1234'
        };

        let config = { ...DEFAULT_CONFIG };
        let cloudPhotos = [];
        let isLoading = false;

        function loadConfig() {
            config.token = localStorage.getItem('gh_token') || DEFAULT_CONFIG.token;
            config.owner = localStorage.getItem('gh_owner') || DEFAULT_CONFIG.owner;
            config.repo = localStorage.getItem('gh_repo') || DEFAULT_CONFIG.repo;
            config.branch = localStorage.getItem('gh_branch') || DEFAULT_CONFIG.branch;
            config.password = localStorage.getItem('gh_password') || DEFAULT_CONFIG.password;
        }

        loadConfig();

        function getApiUrl(path = '') {
            return `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`;
        }

        // --- ЛОГИКА НАСТРОЕК ---
        function openSettings() {
            document.getElementById('set-token').value = config.token;
            document.getElementById('set-owner').value = config.owner;
            document.getElementById('set-repo').value = config.repo;
            document.getElementById('set-branch').value = config.branch;
            document.getElementById('set-password').value = config.password;
            document.getElementById('settings-screen').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
        }

        function saveSettings() {
            config.token = document.getElementById('set-token').value.trim();
            config.owner = document.getElementById('set-owner').value.trim();
            config.repo = document.getElementById('set-repo').value.trim();
            config.branch = document.getElementById('set-branch').value.trim();
            config.password = document.getElementById('set-password').value.trim();

            if (!config.token || !config.owner || !config.repo || !config.branch || !config.password) {
                showStatus('Пожалуйста, заполните все поля!', 'error');
                return;
            }

            localStorage.setItem('gh_token', config.token);
            localStorage.setItem('gh_owner', config.owner);
            localStorage.setItem('gh_repo', config.repo);
            localStorage.setItem('gh_branch', config.branch);
            localStorage.setItem('gh_password', config.password);

            closeSettings();
            alert('✓ Настройки успешно сохранены!');
        }

        // --- АВТОРИЗАЦИЯ ---
        function checkPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === config.password) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('album-screen').classList.add('active');
                loadGalleryFromCloud();
            } else {
                const err = document.getElementById('login-error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('album-screen').classList.remove('active');
            document.getElementById('password-input').value = '';
            cloudPhotos = [];
        }

        // --- РАБОТА С GITHUB API ---

        async function fetchCloudData() {
            const rawUrl = `https://raw.githubusercontent.com/${config.owner}/${config.repo}/${config.branch}/data.json`;
            try {
                const res = await fetch(rawUrl + '?t=' + Date.now());
                if (!res.ok) throw new Error('Файл данных еще не создан');
                const data = await res.json();
                const photos = Array.isArray(data.photos) ? data.photos : [];
                return await enrichPhotos(photos);
            } catch (e) {
                console.error('Ошибка загрузки данных:', e);
                throw e;
            }
        }

        async function enrichPhotos(photos) {
            if (!Array.isArray(photos)) return [];
            const result = [];

            for (const p of photos) {
                const photo = { ...p };

                if ((!photo.url || photo.url.indexOf('raw.githubusercontent.com') === -1) && photo.path) {
                    photo.url = `https://raw.githubusercontent.com/${config.owner}/${config.repo}/${config.branch}/${photo.path}`;
                }

                if (!photo.sha && photo.path && config.token) {
                    try {
                        const apiUrl = getApiUrl(photo.path);
                        const res = await fetch(apiUrl, {
                            headers: {
                                'Authorization': `token ${config.token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        });
                        if (res.ok) {
                            const meta = await res.json();
                            if (meta && meta.sha) photo.sha = meta.sha;
                        }
                    } catch (e) {
                        console.warn('Не удалось получить SHA для', photo.path);
                    }
                }

                result.push(photo);
            }

            return result;
        }

        async function updateDataJson(photosArray) {
            if (!config.token) throw new Error('Требуется GitHub token для записи в репозитории');

            const apiUrl = getApiUrl('data.json');
            const headers = {
                'Authorization': `token ${config.token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            let sha = null;

            try {
                const metaRes = await fetch(apiUrl, { headers });
                if (metaRes.ok) {
                    const metaData = await metaRes.json();
                    sha = metaData.sha;
                }
            } catch (e) {
                console.warn('Файл data.json еще не существует');
            }

            const payload = JSON.stringify({ photos: photosArray }, null, 2);
            const content = btoa(unescape(encodeURIComponent(payload)));

            const body = {
                message: `📸 Update gallery (${new Date().toLocaleString('ru-RU')})`,
                content: content,
                branch: config.branch
            };

            if (sha) body.sha = sha;

            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.message || 'Ошибка сохранения data.json');
            }
        }

        async function uploadImageToGitHub(file) {
            if (!config.token) throw new Error('Требуется GitHub token для загрузки файлов');

            const base64 = await getBase64(file);
            const cleanBase64 = base64.split(',')[1];

            const fileName = Date.now() + '_' + file.name.replace(/\s+/g, '_').substring(0, 50);
            const path = `images/${fileName}`;
            const apiUrl = getApiUrl(path);

            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `📸 Upload ${fileName}`,
                    content: cleanBase64,
                    branch: config.branch
                })
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.message || 'Ошибка загрузки картинки');
            }

            const data = await res.json();
            const displayUrl = `https://raw.githubusercontent.com/${config.owner}/${config.repo}/${config.branch}/${path}`;
            const sha = data.content && data.content.sha ? data.content.sha : null;

            return { url: displayUrl, sha: sha, path: path };
        }

        async function deleteImageFromGitHub(path, sha) {
            if (!config.token) throw new Error('Требуется GitHub token для удаления файлов');

            const apiUrl = getApiUrl(path);
            const res = await fetch(apiUrl, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `🗑 Delete ${path}`,
                    sha: sha,
                    branch: config.branch
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || 'Ошибка удаления файла');
            }
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function fetchFileSha(path) {
            if (!config.token) return null;
            try {
                const apiUrl = getApiUrl(path);
                const res = await fetch(apiUrl, {
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (!res.ok) return null;
                const meta = await res.json();
                return meta.sha || null;
            } catch (e) {
                return null;
            }
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status-msg');
            status.innerText = message;
            status.style.display = 'block';
            status.className = 'status-msg';

            if (type === 'error') {
                status.classList.add('error');
            } else if (type === 'success') {
                status.classList.add('success');
            }

            if (type !== 'loading') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }

        // --- ЛОГИКА ГАЛЕРЕИ ---
        async function loadGalleryFromCloud() {
            if (isLoading) return;
            isLoading = true;

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            showStatus('⏳ Загрузка данных из репозитория...', 'loading');

            try {
                cloudPhotos = await fetchCloudData();
                showStatus('✓ Галерея загружена', 'success');
                renderGallery();
            } catch (e) {
                if (e.message && e.message.includes('Файл данных еще не создан')) {
                    cloudPhotos = [];
                    showStatus('✓ Альбом пуст', 'info');
                    renderGallery();
                } else {
                    showStatus('❌ Ошибка! Проверьте настройки (Token, Owner, Repo, Branch).', 'error');
                    console.error(e);
                }
            } finally {
                isLoading = false;
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (cloudPhotos.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666; padding: 40px;">📭 Альбом пуст. Загрузите первую фотографию!</p>';
                return;
            }

            cloudPhotos.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.url}" alt="Фото" loading="lazy" onerror="this.parentElement.style.opacity='0.5'">
                    <button class="delete-btn" onclick="deletePhoto(${index})">🗑 Удалить</button>
                `;
                gallery.appendChild(div);
            });
        }

        async function handleFiles(files) {
            if (isLoading) {
                showStatus('⏳ Подождите, идет загрузка...', 'info');
                return;
            }

            if (!files || files.length === 0) return;

            const loader = document.getElementById('upload-loader');
            const uploadArea = document.getElementById('upload-area');

            loader.style.display = 'block';
            uploadArea.style.pointerEvents = 'none';

            try {
                if (!config.token) {
                    throw new Error('GitHub token не настроен. Откройте настройки и добавьте токен.');
                }

                isLoading = true;
                cloudPhotos = await fetchCloudData().catch(() => []);

                for (let i = 0; i < files.length; i++) {
                    showStatus(`⏳ Загрузка ${i + 1} / ${files.length}...`, 'loading');
                    const newFileData = await uploadImageToGitHub(files[i]);
                    cloudPhotos.push(newFileData);
                }

                showStatus('⏳ Обновление базы данных...', 'loading');
                await updateDataJson(cloudPhotos);
                showStatus(`✓ Загружено ${files.length} фото!`, 'success');
                renderGallery();

            } catch (e) {
                showStatus(`❌ Ошибка: ${e.message}`, 'error');
                console.error(e);
                loadGalleryFromCloud();
            } finally {
                isLoading = false;
                loader.style.display = 'none';
                uploadArea.style.pointerEvents = 'auto';
                document.getElementById('file-input').value = '';
            }
        }

        async function deletePhoto(index) {
            if (!confirm('🗑 Удалить это фото из репозитория навсегда?')) return;

            if (isLoading) {
                showStatus('⏳ Подождите, идет операция...', 'info');
                return;
            }

            showStatus('⏳ Удаление файла...', 'loading');
            isLoading = true;

            try {
                const photoToDelete = cloudPhotos[index];
                if (!photoToDelete) throw new Error('Фото не найдено');

                let sha = photoToDelete.sha;
                if (!sha && photoToDelete.path) {
                    sha = await fetchFileSha(photoToDelete.path);
                }

                if (!sha) throw new Error('SHA файла не найден. Невозможно удалить без SHA.');

                await deleteImageFromGitHub(photoToDelete.path, sha);
                cloudPhotos.splice(index, 1);
                await updateDataJson(cloudPhotos);

                showStatus('✓ Фото удалено', 'success');
                renderGallery();

            } catch (e) {
                showStatus(`❌ Ошибка удаления: ${e.message}`, 'error');
                console.error(e);
            } finally {
                isLoading = false;
            }
        }

        // Drag and Drop
        const uploadArea = document.getElementById('upload-area');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        // Enter для входа
        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // Загрузить галерею при загрузке страницы
        window.addEventListener('load', () => {
            if (!document.getElementById('login-screen').classList.contains('hidden')) {
                // Экран входа активен, не загружаем
            }
        });
    </script>
</body>
</html>
