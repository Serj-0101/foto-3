<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный Альбом на ImgBB</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #bb86fc;
            --error-color: #cf6679;
            --success-color: #4caf50;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #login-screen, #settings-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
        }

        #settings-screen {
            z-index: 200;
            background-color: rgba(18, 18, 18, 0.98);
        }

        .hidden {
            display: none !important;
        }

        .box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
            position: relative;
        }

        .settings-box {
            width: 450px;
            max-width: 90vw;
            padding: 30px;
            text-align: left;
        }

        .settings-box h2,
        .settings-box p {
            text-align: center;
        }

        input[type="password"],
        input[type="text"],
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        input[type="password"],
        input[type="text"] {
            background: #2c2c2c;
            color: white;
            outline: none;
            transition: border 0.3s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            border: 2px solid var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        button:hover {
            background-color: #a06cd5;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: #333;
            color: white;
        }

        button.secondary:hover {
            background-color: #444;
        }

        #login-error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: auto;
            background-color: #e63946;
            color: white;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 300;
        }

        .settings-btn:hover {
            background-color: #ff4d5a;
            transform: translateY(-2px);
        }

        .settings-label {
            text-align: left;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            margin-top: 15px;
            display: block;
        }

        #album-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin: 0 auto;
        }

        #album-screen.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-top: 60px;
        }

        .header h1 {
            margin: 0;
            flex: 1;
        }

        .upload-area {
            border: 2px dashed #444;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            position: relative;
            background: #0a0a0a;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(187, 134, 252, 0.08);
        }

        .upload-area.drag-over {
            border-color: var(--accent-color);
            background: rgba(187, 134, 252, 0.15);
        }

        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-area h3,
        .upload-area p {
            margin: 0;
            pointer-events: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            position: relative;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            border-radius: 20px;
            width: auto;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: var(--error-color);
            color: white;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .status-msg {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-style: italic;
            min-height: 25px;
        }

        .status-msg.error {
            color: var(--error-color);
            font-style: normal;
        }

        .status-msg.success {
            color: var(--success-color);
            font-style: normal;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                margin-top: 80px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header button {
                width: 100%;
            }

            .box {
                width: 90vw;
                max-width: 350px;
                padding: 30px;
            }

            .settings-box {
                width: 90vw;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .upload-area {
                padding: 20px;
            }

            .settings-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen">
        <button class="settings-btn" onclick="openSettings()" title="Настройки ImgBB">⚙️ Настройки</button>
        <div class="box">
            <h2>🔐 Вход в альбом</h2>
            <input type="password" id="password-input" placeholder="Введите пароль">
            <button onclick="checkPassword()">Войти</button>
            <div id="login-error">❌ Неверный пароль</div>
        </div>
    </div>

    <!-- МЕНЮ НАСТРОЕК -->
    <div id="settings-screen" class="hidden">
        <div class="box settings-box">
            <h2>⚙️ Настройки ImgBB</h2>
            <p style="font-size: 13px; color: #aaa;">Получить API ключ можно на <b>imgbb.com</b></p>

            <label class="settings-label">ImgBB API Key</label>
            <input type="text" id="set-imgbb-key" placeholder="Вставьте ваш ImgBB API ключ">

            <label class="settings-label">Пароль для входа (локальный)</label>
            <input type="text" id="set-password" placeholder="Придумайте пароль">

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveSettings()">✓ Сохранить</button>
                <button class="secondary" onclick="closeSettings()">✕ Отмена</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН АЛЬБОМА -->
    <div id="album-screen">
        <div class="header">
            <h1>☁️ Фотохранилище ImgBB</h1>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="secondary" onclick="window.open('game.html','_blank')" style="width: auto;">🎮 Играть</button>
                <button class="secondary" onclick="logout()" style="width: auto;">↪️ Выйти</button>
            </div>
        </div>

        <div class="status-msg" id="status-msg"></div>

        <div class="upload-area" id="upload-area">
            <h3>📸 Нажмите или перетащите фотографии сюда</h3>
            <p style="font-size: 14px; color: #999;">Они сохранятся в облако ImgBB</p>
            <input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">
            <div class="loader" id="upload-loader"></div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // Настройки по умолчанию
        const DEFAULT_CONFIG = {
            imgbbKey: '',
            password: '1234'
        };

        let config = { ...DEFAULT_CONFIG };
        let cloudPhotos = [];
        let isLoading = false;

        // ImgBB API endpoint
        const IMGBB_API = 'https://api.imgbb.com/1/upload';

        function loadConfig() {
            config.imgbbKey = localStorage.getItem('imgbb_key') || DEFAULT_CONFIG.imgbbKey;
            config.password = localStorage.getItem('imgbb_password') || DEFAULT_CONFIG.password;
        }

        loadConfig();

        // --- ЛОГИКА НАСТРОЕК ---
        function openSettings() {
            document.getElementById('set-imgbb-key').value = config.imgbbKey;
            document.getElementById('set-password').value = config.password;
            document.getElementById('settings-screen').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
        }

        function saveSettings() {
            config.imgbbKey = document.getElementById('set-imgbb-key').value.trim();
            config.password = document.getElementById('set-password').value.trim();

            if (!config.imgbbKey || !config.password) {
                showStatus('Пожалуйста, заполните все поля!', 'error');
                return;
            }

            localStorage.setItem('imgbb_key', config.imgbbKey);
            localStorage.setItem('imgbb_password', config.password);

            closeSettings();
            alert('✓ Настройки успешно сохранены!');
        }

        // --- АВТОРИЗАЦИЯ ---
        function checkPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === config.password) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('album-screen').classList.add('active');
                loadGalleryFromCloud();
            } else {
                const err = document.getElementById('login-error');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 2000);
            }
        }

        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('album-screen').classList.remove('active');
            document.getElementById('password-input').value = '';
            cloudPhotos = [];
        }

        // --- РАБОТА С IMGBB API ---

        async function uploadImageToImgBB(file) {
            if (!config.imgbbKey) throw new Error('ImgBB API ключ не настроен. Откройте настройки и добавьте ключ.');

            const formData = new FormData();
            formData.append('image', file);
            formData.append('key', config.imgbbKey);

            try {
                const res = await fetch(IMGBB_API, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error?.message || 'Ошибка загрузки на ImgBB');
                }

                const data = await res.json();
                
                if (!data.success) {
                    throw new Error(data.error?.message || 'Ошибка загрузки фотографии');
                }

                return {
                    url: data.data.display_url,
                    thumbUrl: data.data.thumb.url,
                    deleteUrl: data.data.delete_url,
                    imgbbId: data.data.id,
                    title: file.name
                };
            } catch (e) {
                console.error('ImgBB upload error:', e);
                throw e;
            }
        }

        async function deleteImageFromImgBB(deleteUrl) {
            if (!config.imgbbKey) throw new Error('ImgBB API ключ не настроен');

            try {
                const res = await fetch(deleteUrl);
                if (!res.ok) {
                    throw new Error('Ошибка удаления фото с ImgBB');
                }
                return true;
            } catch (e) {
                console.error('ImgBB delete error:', e);
                throw e;
            }
        }

        // --- РАБОТА С ЛОКАЛЬНЫМ ХРАНИЛИЩЕМ ---

        function savePhotosToLocalStorage() {
            localStorage.setItem('photos_data', JSON.stringify(cloudPhotos));
        }

        function loadPhotosFromLocalStorage() {
            try {
                const stored = localStorage.getItem('photos_data');
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error('Ошибка загрузки фото:', e);
                return [];
            }
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status-msg');
            status.innerText = message;
            status.style.display = 'block';
            status.className = 'status-msg';

            if (type === 'error') {
                status.classList.add('error');
            } else if (type === 'success') {
                status.classList.add('success');
            }

            if (type !== 'loading') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }

        // --- ЛОГИКА ГАЛЕРЕИ ---
        async function loadGalleryFromCloud() {
            if (isLoading) return;
            isLoading = true;

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            showStatus('⏳ Загрузка галереи...', 'loading');

            try {
                cloudPhotos = loadPhotosFromLocalStorage();
                showStatus('✓ Галерея загружена', 'success');
                renderGallery();
            } catch (e) {
                showStatus('❌ Ошибка загрузки галереи', 'error');
                console.error(e);
            } finally {
                isLoading = false;
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (cloudPhotos.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666; padding: 40px;">📭 Альбом пуст. Загрузите первую фотографию!</p>';
                return;
            }

            cloudPhotos.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.thumbUrl || item.url}" alt="${item.title}" loading="lazy" onerror="this.parentElement.style.opacity='0.5'">
                    <button class="delete-btn" onclick="deletePhoto(${index})">🗑 Удалить</button>
                `;
                gallery.appendChild(div);
            });
        }

        async function handleFiles(files) {
            if (isLoading) {
                showStatus('⏳ Подождите, идет загрузка...', 'info');
                return;
            }

            if (!files || files.length === 0) return;

            const loader = document.getElementById('upload-loader');
            const uploadArea = document.getElementById('upload-area');

            loader.style.display = 'block';
            uploadArea.style.pointerEvents = 'none';

            try {
                if (!config.imgbbKey) {
                    throw new Error('ImgBB API ключ не настроен. Откройте настройки и добавьте ключ.');
                }

                isLoading = true;
                cloudPhotos = loadPhotosFromLocalStorage();

                for (let i = 0; i < files.length; i++) {
                    showStatus(`⏳ Загрузка ${i + 1} / ${files.length}...`, 'loading');
                    const newPhotoData = await uploadImageToImgBB(files[i]);
                    cloudPhotos.push(newPhotoData);
                }

                savePhotosToLocalStorage();
                showStatus(`✓ Загружено ${files.length} фото!`, 'success');
                renderGallery();

            } catch (e) {
                showStatus(`❌ Ошибка: ${e.message}`, 'error');
                console.error(e);
            } finally {
                isLoading = false;
                loader.style.display = 'none';
                uploadArea.style.pointerEvents = 'auto';
                document.getElementById('file-input').value = '';
            }
        }

        async function deletePhoto(index) {
            if (!confirm('🗑 Удалить это фото?')) return;

            if (isLoading) {
                showStatus('⏳ Подождите, идет операция...', 'info');
                return;
            }

            showStatus('⏳ Удаление файла...', 'loading');
            isLoading = true;

            try {
                const photoToDelete = cloudPhotos[index];
                if (!photoToDelete) throw new Error('Фото не найдено');

                if (photoToDelete.deleteUrl) {
                    await deleteImageFromImgBB(photoToDelete.deleteUrl);
                }

                cloudPhotos.splice(index, 1);
                savePhotosToLocalStorage();

                showStatus('✓ Фото удалено', 'success');
                renderGallery();

            } catch (e) {
                showStatus(`❌ Ошибка удаления: ${e.message}`, 'error');
                console.error(e);
            } finally {
                isLoading = false;
            }
        }

        // Drag and Drop
        const uploadArea = document.getElementById('upload-area');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        // Enter для входа
        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // Загрузить галерею при загрузке страницы
        window.addEventListener('load', () => {
            if (!document.getElementById('login-screen').classList.contains('hidden')) {
                // Экран входа активен, не загружаем
            }
        });
    </script>
</body>
</html>
